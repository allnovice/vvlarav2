name: Laravel Tests (Sail)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env
        run: cp .env.example .env

      - name: Configure CI environment
        run: |
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=mariadb" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=laravel" >> .env
          echo "DB_USERNAME=sail" >> .env
          echo "DB_PASSWORD=password" >> .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Build Vite assets
        run: npm run build

      - name: Start Sail
        run: ./vendor/bin/sail up -d

      - name: Test write access
        run: |
         ./vendor/bin/sail exec laravel.test sh -c 'echo hello > /tmp/test && cat /tmp/test'
         ./vendor/bin/sail exec laravel.test sh -c 'touch /var/www/html/storage/logs/test.log'
         ./vendor/bin/sail exec laravel.test sh -c 'echo test >> /var/www/html/.env'
         ./vendor/bin/sail exec laravel.test mount | grep "/var/www/html"
  
      - name: Debug permissions
        run: |
         ./vendor/bin/sail exec laravel.test id
          ./vendor/bin/sail exec laravel.test ls -ld /var/www/html
          ./vendor/bin/sail exec laravel.test ls -ld /var/www/html/storage
          ./vendor/bin/sail exec laravel.test ls -l /var/www/html/.env
  
      - name: Wait for MariaDB
        run: |
          until ./vendor/bin/sail exec mariadb mariadb-admin ping --silent; do
            sleep 10
          done

      - name: Generate application key
        run: ./vendor/bin/sail artisan key:generate

      - name: Run migrations
        run: ./vendor/bin/sail artisan migrate --force

      - name: Run tests
        run: ./vendor/bin/sail artisan test

      - name: Stop Sail
        if: always()
        run: ./vendor/bin/sail down
