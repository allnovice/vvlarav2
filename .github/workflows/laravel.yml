name: Laravel Tests (Sail - Optimized)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # PHP + Composer
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # -------------------------
      # Node / Vite
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Build assets (Vite)
        run: npm run build

      # -------------------------
      # Docker cache (Sail)
      # -------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Build Sail containers (cached)
        run: |
          docker compose build \
            --build-arg BUILDKIT_INLINE_CACHE=1

      # -------------------------
      # Start Sail
      # -------------------------
      - name: Start Sail
        run: ./vendor/bin/sail up -d

      - name: Wait for MariaDB
        run: |
          until ./vendor/bin/sail exec mariadb mariadb-admin ping --silent; do
            sleep 2
          done

      # -------------------------
      # Laravel setup
      # -------------------------
      - name: Generate application key
        run: ./vendor/bin/sail artisan key:generate

      - name: Run migrations
        run: ./vendor/bin/sail artisan migrate --force

      # -------------------------
      # Run tests
      # -------------------------
      - name: Run tests
        run: ./vendor/bin/sail artisan test

      # -------------------------
      # Cleanup
      # -------------------------
      - name: Stop Sail
        if: always()
        run: ./vendor/bin/sail down
